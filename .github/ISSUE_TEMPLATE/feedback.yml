name: 提交反馈
description: 报告网站问题、提出功能建议或提交资料订正
title: "[Feedback] "
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 bandori.fans！请描述可公开观察到的问题或建议。
        请勿提交账号、密钥、个人隐私、安全漏洞利用细节或其他敏感信息。

  - type: dropdown
    id: feedback_type
    attributes:
      label: 反馈类型
      options:
        - 网站问题
        - 功能建议
        - 资料订正
        - 其他
    validations:
      required: true

  - type: input
    id: related_url
    attributes:
      label: 相关页面 URL（可选）
      description: 如果反馈涉及具体页面，请提供页面地址；资料尚未收录时可填写最相关的列表页。
      placeholder: https://bandori.fans/...

  - type: textarea
    id: description
    attributes:
      label: 详细说明
      description: 请说明当前情况、遇到的问题或希望解决的使用场景。
      placeholder: 当前……
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: 期望结果
      description: 请说明你期望的行为、功能或正确资料内容。
      placeholder: 希望……
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤（可选）
      description: 报告网站问题时，请尽量列出触发问题的操作步骤。
      placeholder: |
        1. 打开……
        2. 点击或选择……
        3. 出现……

  - type: textarea
    id: evidence
    attributes:
      label: 截图、来源或参考资料（可选）
      description: 可附截图、录屏、报错文本、官方来源或其他公开可核验资料。

  - type: input
    id: environment
    attributes:
      label: 使用环境（可选）
      description: 网站问题可填写设备、操作系统、浏览器及版本。
      placeholder: Windows 11 / Chrome 版本……

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同反馈。
          required: true
        - label: 本 Issue 聚焦一个主要问题或建议。
          required: true
        - label: 我确认以上内容可以公开分享，且不包含敏感信息或安全漏洞利用细节。
          required: true
