name: 数据订正（简体中文）
description: 报告站内资料的错误、缺漏或需要更新之处
title: "[Data] "
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢帮助我们改进资料质量！本仓库用于接收 bandori.fans 的公开反馈与资料订正，维护团队会统一核对和跟进。
        如能从具体条目的“订正”入口提交，也可优先使用站内表单；你也可以继续在这里报告。请勿提交个人隐私、未公开资料或其他敏感信息。

  - type: input
    id: affected_url
    attributes:
      label: 条目或页面 URL
      description: 请提供资料当前所在的具体页面；如果整条资料尚未收录，请填写最相关的列表页。
      placeholder: https://bandori.fans/...
    validations:
      required: true

  - type: dropdown
    id: data_type
    attributes:
      label: 资料类别
      options:
        - 新闻
        - 演出或活动
        - 歌曲
        - 团体
        - 角色
        - 声优
        - 会场
        - CD 或发售
        - 日历
        - 其他
    validations:
      required: true

  - type: input
    id: affected_field
    attributes:
      label: 涉及字段
      description: 例如标题、日期、出演者、曲目、会场或发售信息。
      placeholder: 演出日期
    validations:
      required: true

  - type: textarea
    id: current_value
    attributes:
      label: 当前内容
      description: 请说明页面目前显示的错误、缺漏或过期内容。
      placeholder: 当前显示为……
    validations:
      required: true

  - type: textarea
    id: expected_value
    attributes:
      label: 正确内容应为
      description: 请写明你建议订正后的内容。
      placeholder: 正确内容应为……
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 核验依据（强烈建议）
      description: 请尽量提供官方公告、官方网站、实体资料说明或其他可公开核验的来源。
      placeholder: 来源链接、资料名称及必要说明……

  - type: dropdown
    id: locale
    attributes:
      label: 涉及语言（可选）
      options:
        - 不区分
        - 简体中文
        - 日本語
        - English
        - 其他

  - type: textarea
    id: additional_context
    attributes:
      label: 截图或补充说明（可选）
      description: 可附当前页面截图或其他有助于核对的信息。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认该页面当前仍存在此资料问题，并搜索过相同 Issue。
          required: true
        - label: 我确认提交的信息可以公开分享，且不包含个人隐私、未公开资料或其他敏感信息。
          required: true
