name: 功能建议（简体中文）
description: 提议新的功能、体验改进或使用场景
title: "[Feature] "
labels:
  - enhancement
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！本仓库用于接收 bandori.fans 的公开反馈，维护团队会统一评估和跟进。
        请尽量说明实际使用场景和希望解决的问题，无需提供具体技术实现方案。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与当前问题
      description: 你在什么情况下遇到了什么不便？
      placeholder: 当我需要……时，目前……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的功能或期望结果
      description: 请描述你希望看到的行为或体验。
      placeholder: 我希望可以……
    validations:
      required: true

  - type: input
    id: related_url
    attributes:
      label: 相关页面 URL（可选）
      placeholder: https://bandori.fans/...

  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方式（可选）
      description: 如果目前有临时解决办法，可以在这里说明。

  - type: textarea
    id: examples
    attributes:
      label: 示例或参考资料（可选）
      description: 可附示意图、参考链接或类似产品的交互案例。

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息（可选）

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同或高度相似的建议。
          required: true
        - label: 本 Issue 聚焦一个主要需求。
          required: true
        - label: 我确认以上内容不包含个人隐私或其他敏感信息。
          required: true
