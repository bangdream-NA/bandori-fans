name: 共建申请（简体中文）
description: 提交公开作品和协作信息，申请参与 bandori.fans 的开发与维护
title: "[共建申请] "
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你愿意参与 bandori.fans 的共建！

        此 Issue 及其中的全部内容都会公开。请勿填写 QQ、微信、手机号、私人邮箱、真实姓名，也不要提交私有代码、密钥、内部链接、未公开的安全漏洞或其他敏感信息。

        维护者会根据公开作品、技术经验、问题分析与协作习惯进行审核。审核通过后，会优先通过你在 GitHub 主页主动公开的渠道联系；若主页没有公开渠道，维护者会在 Issue 中提供项目方控制的私密联系入口。请勿为了申请而在 Issue 中公开私人联系方式。提交申请不代表一定会获邀。

  - type: dropdown
    id: contribution_area
    attributes:
      label: 希望参与的方向
      description: 可选择多个方向。
      multiple: true
      options:
        - 前端开发
        - 后端开发
        - 数据处理与维护
        - 测试与质量保障
        - 部署与基础设施
        - 文档与本地化
        - 其他
    validations:
      required: true

  - type: textarea
    id: public_work
    attributes:
      label: 公开代码作品与贡献
      description: 请提供 1–3 项可公开核验的 GitHub 仓库、Pull Request、Gist 或在线项目，并说明你本人完成的部分。没有现成公开作品时，可以新建一个公开 Gist；请勿粘贴大段代码或提交敏感信息。
      placeholder: |
        - 链接：
        - 本人负责的部分：
        - 使用的语言和技术：
        - 解决的问题：
        - 最能体现能力的代码位置：
    validations:
      required: true

  - type: textarea
    id: technical_experience
    attributes:
      label: 技术经验
      description: 请简要说明你熟悉的语言、框架和工具，以及测试、数据库、Git 或 CI/CD 等相关经验。请勿透露任职单位或项目的保密信息。
      placeholder: |
        例如：
        - TypeScript / React：使用时长、熟悉程度与项目职责
        - Python：参与过的项目及本人负责的部分
        - 数据库、测试、部署等其他经验
    validations:
      required: true

  - type: dropdown
    id: coding_agent_level
    attributes:
      label: Coding Agent 熟练度
      description: 包括 Codex、Claude Code、GitHub Copilot 等可参与代码分析与修改的 Agent 工具。
      options:
        - 尚未使用
        - 基础使用，能完成简单问答或代码生成
        - 能独立使用，并审查差异与运行测试
        - 熟练使用，能组织上下文、拆分任务并处理 Agent 失误
        - 能设计多 Agent 或自动化开发工作流
    validations:
      required: true

  - type: textarea
    id: coding_agent_experience
    attributes:
      label: Coding Agent 使用案例
      description: 请说明使用过的工具、完成的任务，以及你如何检查代码差异、验证测试并避免直接接受错误结果。没有相关经验时请填写“暂无”。
      placeholder: |
        - 使用的工具：
        - 完成的任务：
        - 如何提供上下文和拆分任务：
        - 如何审查、测试和纠错：
    validations:
      required: true

  - type: dropdown
    id: github_cicd_level
    attributes:
      label: GitHub CI/CD 熟练度
      options:
        - 尚未使用 GitHub Actions
        - 能阅读并运行现有工作流
        - 能独立编写和维护基础工作流
        - 熟练进行检查、缓存、制品、环境和部署配置
        - 能负责复杂工作流设计、故障排查、发布与回滚
    validations:
      required: true

  - type: textarea
    id: github_cicd_experience
    attributes:
      label: GitHub CI/CD 实践案例
      description: 请说明你实际维护过的 GitHub Actions 或交付流程，包括触发条件、检查或部署内容、失败排查和回滚方式。请勿粘贴 Secret 或其他敏感配置；没有相关经验时请填写“暂无”。
      placeholder: |
        - 工作流用途与链接（如可公开）：
        - 触发条件与主要步骤：
        - 如何处理失败检查：
        - 发布、回滚或权限安全措施：
    validations:
      required: true

  - type: textarea
    id: problem_analysis
    attributes:
      label: 问题分析案例
      description: 请优先选择一个你亲自处理过的技术问题，说明现象、假设、证据、定位、修复和验证。若没有合适的公开案例，请回答下方的假设题。
      placeholder: |
        真实案例：
        - 问题现象：
        - 初始假设与证据：
        - 定位过程与根因：
        - 解决方案与验证：
        - 结果与反思：

        没有合适案例时，请回答：
        某个网页偶尔显示旧数据，但刷新后恢复。你会如何复现，并区分前端缓存、接口、CDN 和源数据问题？你会如何验证修复没有引入回归？
    validations:
      required: true

  - type: textarea
    id: collaboration
    attributes:
      label: 协作习惯
      description: 请说明你通常如何确认不明确的需求、拆分任务、组织提交、参与 Code Review、处理意见分歧，以及补充测试和文档。
      placeholder: 简要描述你的协作流程和习惯。
    validations:
      required: true

  - type: dropdown
    id: weekly_time
    attributes:
      label: 预计每周投入时间
      options:
        - 少于 2 小时
        - 2–5 小时
        - 5–10 小时
        - 10 小时以上
        - 暂时无法确定
    validations:
      required: true

  - type: dropdown
    id: participation_period
    attributes:
      label: 预计参与周期
      options:
        - 一个月以内
        - 1–3 个月
        - 3–6 个月
        - 半年以上
        - 希望长期参与
        - 暂时无法确定
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我确认上述内容可以公开，且未填写私人联系方式、真实身份、私有代码、密钥或其他敏感信息。
          required: true
        - label: 我确认作品链接及个人贡献说明真实准确。
          required: true
        - label: 我愿意接受 Code Review，并在需要时完成一个小型公开试题。
          required: true
