name: 缺陷报告
description: 报告网站页面、交互、显示、搜索或日历订阅中的可复现问题
title: "[Bug] "
labels:
  - bug
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！本仓库用于接收 bandori.fans 的公开反馈与资料订正，维护团队会统一跟进处理。
        请聚焦可公开观察到的现象，并勿提交账号、密钥、个人隐私或其他敏感信息。若是资料内容有误，请改用“数据订正”表单。
        如果你怀疑问题涉及安全漏洞，请勿通过公开 Issue 披露复现细节、攻击载荷或任何敏感数据。

  - type: input
    id: affected_url
    attributes:
      label: 受影响页面 URL
      description: 请提供出现问题的具体页面地址；全站问题可填写任一能复现的页面。
      placeholder: https://bandori.fans/...
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: 问题描述与实际结果
      description: 请说明发生了什么，以及页面实际显示或执行的结果。
      placeholder: 我在……时发现……，实际结果是……
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请列出能稳定或较容易触发问题的操作步骤。
      placeholder: |
        1. 打开……
        2. 选择或点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 预期结果
      placeholder: 正常情况下应该……
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 使用环境（可选）
      description: 例如设备类型、操作系统、浏览器及版本。
      placeholder: Windows 11 / Chrome 版本……

  - type: textarea
    id: evidence
    attributes:
      label: 截图、录屏或报错信息（可选）
      description: 可直接拖入图片或视频，也可粘贴不含敏感信息的报错文本。

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息（可选）
      description: 其他有助于确认问题范围或出现频率的信息。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 本 Issue 聚焦一个主要问题；相关现象已放在补充信息中。
          required: true
        - label: 我确认以上内容不包含账号、密钥、个人隐私或其他敏感信息。
          required: true
        - label: 我确认此报告不包含安全漏洞的利用细节；安全问题不会通过公开 Issue 披露。
          required: true
